<svg xmlns="http://www.w3.org/2000/svg" width="950" height="620" viewBox="0 0 950 620"><title>Rider action placement and thumb-reach proposal</title><desc>Illustrative layout proposal, not a screenshot or device verification.</desc><rect x="0" y="0" width="950" height="620" rx="0" fill="#F8F5F4" stroke="none"/><text x="50" y="49" font-family="Plus Jakarta Sans, sans-serif" font-size="25" font-weight="600" fill="#0F172A">Reach is a constraint to test, not one universal heat map.</text><text x="50" y="80" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="500" fill="#475569">Place frequent actions above the reserved bottom region and support both hands.</text><text x="95" y="113" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="600" fill="#0F172A">Left-hand grip test</text><rect x="95" y="132" width="282" height="380" rx="20" fill="#F7F7FA" stroke="#CBD5E1"/><text x="113" y="168" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="500" fill="#0F172A">Back</text><text x="302" y="168" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="500" fill="#0F172A">Help</text><rect x="113" y="192" width="246" height="102" rx="20" fill="#FFFFFF" stroke="#E2E8F0"/><text x="130" y="223" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="600" fill="#0F172A">Parcel and stop context</text><text x="130" y="254" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="500" fill="#475569">Readable address first</text><rect x="113" y="319" width="246" height="104" rx="20" fill="#FFF2F4" stroke="none"/><text x="129" y="346" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="600" fill="#C20836">Proposed action band</text><rect x="125" y="365" width="222" height="48" rx="12" fill="#E00D42" stroke="none"/><text x="169" y="395" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Primary action</text><rect x="103" y="444" width="266" height="60" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/><text x="123" y="475" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="500" fill="#475569">Navigation / safe insets</text><text x="545" y="113" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="600" fill="#0F172A">Right-hand grip test</text><rect x="545" y="132" width="282" height="380" rx="20" fill="#F7F7FA" stroke="#CBD5E1"/><text x="563" y="168" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="500" fill="#0F172A">Back</text><text x="752" y="168" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="500" fill="#0F172A">Help</text><rect x="563" y="192" width="246" height="102" rx="20" fill="#FFFFFF" stroke="#E2E8F0"/><text x="580" y="223" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="600" fill="#0F172A">Parcel and stop context</text><text x="580" y="254" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="500" fill="#475569">Readable address first</text><rect x="563" y="319" width="246" height="104" rx="20" fill="#FFF2F4" stroke="none"/><text x="579" y="346" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="600" fill="#C20836">Proposed action band</text><rect x="575" y="365" width="222" height="48" rx="12" fill="#E00D42" stroke="none"/><text x="619" y="395" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Primary action</text><rect x="553" y="444" width="266" height="60" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/><text x="573" y="475" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="500" fill="#475569">Navigation / safe insets</text><text x="50" y="565" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="500" fill="#475569">Actual coverage varies with hand size, grip and device geometry; the lowest edge can be difficult to reach.</text><text x="50" y="591" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="500" fill="#475569">These sketches show placement rules only. Verify on physical devices while stopped, with keyboard and large text.</text></svg>