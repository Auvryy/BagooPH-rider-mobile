name: bagoo_rider_mobile
description: "BagooPH rider mobile application for pickup and delivery couriers."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  cupertino_icons: ^2.0.0
  device_preview: ^1.3.1
  dio: ^5.9.2
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^10.0.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  file_selector_platform_interface: ^2.7.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/branding/bagoo-mark.png
    - assets/fonts/OFL.txt
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
